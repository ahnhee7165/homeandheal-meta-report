name: 메타 데이터 수집

on:
  schedule:
    # 매일 한국시간 오전 7시 (UTC 22:00)
    - cron: "0 22 * * *"
  workflow_dispatch:
    inputs:
      since:
        description: "시작일 YYYY-MM-DD (비우면 최근 7일)"
        required: false
      until:
        description: "종료일 YYYY-MM-DD (비우면 어제)"
        required: false

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests

      - name: 메타 인사이트 수집
        env:
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          META_API_VERSION: ${{ vars.META_API_VERSION }}
          SINCE: ${{ github.event.inputs.since }}
          UNTIL: ${{ github.event.inputs.until }}
        run: python scripts/fetch_meta.py

      - name: 변경사항 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "변경 없음"
          else
            git commit -m "data: $(TZ=Asia/Seoul date +'%Y-%m-%d') 메타 데이터 갱신"
            git push
          fi
