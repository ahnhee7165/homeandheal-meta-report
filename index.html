<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>홈앤힐 메타 리포트</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
  :root {
    --bg: #f6f5f2; --card: #ffffff; --ink: #1d1c1a; --muted: #6f6b64; --line: #e5e2dc;
    --accent: #2f5d50; --accent-soft: #e3ece8; --up: #1f7a4d; --down: #b3412f;
    --s1: #2f5d50; --s2: #c98b3b; --s3: #5873a8; --s4: #9a5b8c;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #171716; --card: #21201e; --ink: #ecebe7; --muted: #a29e96; --line: #34322f;
      --accent: #7fb8a5; --accent-soft: #263430; --up: #6cc495; --down: #e57d69;
      --s1: #7fb8a5; --s2: #e0ac62; --s3: #8ea6d6; --s4: #c690bb;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: "Noto Sans KR", system-ui, sans-serif; font-size: 14px; }
  .wrap { max-width: 1240px; margin: 0 auto; padding: 28px 16px 60px; }
  header { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 12px; margin-bottom: 20px; }
  h1 { font-size: 22px; margin: 0; letter-spacing: -0.02em; }
  .sub { color: var(--muted); font-size: 12px; margin-top: 4px; }
  .controls { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  select, input[type=date], button {
    font: inherit; font-size: 13px; padding: 7px 10px; border: 1px solid var(--line);
    background: var(--card); color: var(--ink); border-radius: 8px;
  }
  button { cursor: pointer; }
  button.primary { background: var(--accent); color: var(--card); border-color: var(--accent); }
  .tabs { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 16px; }
  .tab { padding: 6px 12px; border-radius: 999px; border: 1px solid var(--line); background: var(--card); font-size: 13px; cursor: pointer; }
  .tab.on { background: var(--ink); color: var(--card); border-color: var(--ink); }
  .kpis { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 16px; }
  @media (max-width: 860px) { .kpis { grid-template-columns: repeat(2, 1fr); } }
  .kpi { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; }
  .kpi .label { color: var(--muted); font-size: 12px; }
  .kpi .val { font-size: 22px; font-weight: 700; margin-top: 4px; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
  .kpi .delta { font-size: 12px; margin-top: 2px; font-variant-numeric: tabular-nums; }
  .up { color: var(--up); } .down { color: var(--down); } .flat { color: var(--muted); }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 16px; margin-bottom: 16px; }
  .card h2 { font-size: 15px; margin: 0 0 12px; display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
  .card h2 small { font-weight: 400; color: var(--muted); font-size: 12px; }
  .chart-box { position: relative; height: 280px; }
  .table-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
  th, td { padding: 8px 10px; border-bottom: 1px solid var(--line); text-align: right; white-space: nowrap; }
  th { color: var(--muted); font-weight: 500; font-size: 12px; cursor: pointer; user-select: none; }
  th:first-child, td:first-child { text-align: left; white-space: normal; min-width: 200px; }
  tr.total td { font-weight: 700; border-top: 2px solid var(--ink); }
  .badge { display: inline-block; font-size: 11px; padding: 1px 6px; border-radius: 4px; margin-left: 6px; background: var(--accent-soft); color: var(--accent); vertical-align: 1px; }
  .note { color: var(--muted); font-size: 12px; line-height: 1.6; }
  .empty { text-align: center; color: var(--muted); padding: 40px 0; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>Home and Heal 메타 광고 리포트</h1>
      <div class="sub" id="updated">데이터 불러오는 중…</div>
    </div>
    <div class="controls">
      <select id="preset">
        <option value="yesterday">어제</option>
        <option value="last7" selected>최근 7일</option>
        <option value="lastweek">지난주 (월~일)</option>
        <option value="thismonth">이번 달</option>
        <option value="lastmonth">지난달</option>
        <option value="custom">직접 선택</option>
      </select>
      <input type="date" id="since"> <span>~</span> <input type="date" id="until">
      <button id="csv">CSV 다운로드</button>
    </div>
  </header>

  <div class="tabs" id="tabs"></div>

  <div class="kpis" id="kpis"></div>

  <div class="card">
    <h2>일별 추이 <small>지출 vs 구매전환값</small></h2>
    <div class="chart-box"><canvas id="trend"></canvas></div>
  </div>

  <div class="card">
    <h2>계정별 성과 <small id="cmpLabel"></small></h2>
    <div class="table-wrap"><table id="accTable"></table></div>
  </div>

  <div class="card">
    <h2>캠페인별 성과 <small>열 제목을 누르면 정렬</small></h2>
    <div class="table-wrap"><table id="campTable"></table></div>
  </div>

  <p class="note">
    협력광고 계정<span class="badge">협력</span>의 구매·장바구니·전환값은 광고관리자의 <b>공유 항목 포함</b> 기준이고,
    자사몰 계정은 픽셀 기준 일반 구매 지표입니다. 비교 기간은 선택 기간과 같은 길이의 직전 기간입니다.
    전환은 기여 기간 동안 늦게 잡히므로 최근 7일 값은 매일 다시 받아 갱신됩니다.
  </p>
</div>

<script>
const fmtW = n => "₩" + Math.round(n).toLocaleString("ko-KR");
const fmtN = n => Math.round(n).toLocaleString("ko-KR");
const fmtP = n => (n * 100).toFixed(2) + "%";
const fmtR = n => (n * 100).toFixed(0) + "%";
const iso = d => d.toISOString().slice(0, 10);
const addDays = (s, n) => { const d = new Date(s + "T00:00:00Z"); d.setUTCDate(d.getUTCDate() + n); return iso(d); };
const daysBetween = (a, b) => Math.round((new Date(b) - new Date(a)) / 86400000) + 1;

let DATA = null, ACCOUNT = "all", chart = null, campSort = { key: "spend", dir: -1 };

function kstToday() { return iso(new Date(Date.now() + 9 * 3600 * 1000)); }

function presetRange(p) {
  const t = kstToday(), y = addDays(t, -1);
  const td = new Date(t + "T00:00:00Z");
  if (p === "yesterday") return [y, y];
  if (p === "last7") return [addDays(t, -7), y];
  if (p === "lastweek") {
    const dow = (td.getUTCDay() + 6) % 7; // 월=0
    const thisMon = addDays(t, -dow);
    return [addDays(thisMon, -7), addDays(thisMon, -1)];
  }
  if (p === "thismonth") return [t.slice(0, 8) + "01", y < t.slice(0, 8) + "01" ? t.slice(0, 8) + "01" : y];
  if (p === "lastmonth") {
    const first = t.slice(0, 8) + "01", lastEnd = addDays(first, -1);
    return [lastEnd.slice(0, 8) + "01", lastEnd];
  }
  return null;
}

function sum(rows) {
  const s = { spend: 0, impressions: 0, reach: 0, clicks: 0, link_clicks: 0, add_to_cart: 0, purchases: 0, purchase_value: 0 };
  for (const r of rows) for (const k in s) s[k] += +r[k] || 0;
  s.ctr = s.impressions ? s.link_clicks / s.impressions : 0;
  s.cpc = s.link_clicks ? s.spend / s.link_clicks : 0;
  s.cpm = s.impressions ? s.spend / s.impressions * 1000 : 0;
  s.cpa = s.purchases ? s.spend / s.purchases : 0;
  s.roas = s.spend ? s.purchase_value / s.spend : 0;
  return s;
}

function filterRows(since, until) {
  return DATA.rows.filter(r => r.date >= since && r.date <= until && (ACCOUNT === "all" || r.account_id === ACCOUNT));
}

function delta(cur, prev, inverse) {
  if (!prev) return '<span class="flat">비교값 없음</span>';
  const d = (cur - prev) / prev;
  if (Math.abs(d) < 0.0005) return '<span class="flat">— 0.0%</span>';
  const good = inverse ? d < 0 : d > 0;
  return `<span class="${good ? "up" : "down"}">${d > 0 ? "▲" : "▼"} ${Math.abs(d * 100).toFixed(1)}%</span>`;
}

function render() {
  const since = document.getElementById("since").value, until = document.getElementById("until").value;
  const len = daysBetween(since, until);
  const pSince = addDays(since, -len), pUntil = addDays(since, -1);
  const cur = filterRows(since, until), prev = filterRows(pSince, pUntil);
  const c = sum(cur), p = sum(prev);
  document.getElementById("cmpLabel").textContent = `비교: ${pSince} ~ ${pUntil}`;

  const kpis = [
    ["지출", fmtW(c.spend), delta(c.spend, p.spend)],
    ["노출", fmtN(c.impressions), delta(c.impressions, p.impressions)],
    ["링크 클릭", fmtN(c.link_clicks), delta(c.link_clicks, p.link_clicks)],
    ["CTR (링크)", fmtP(c.ctr), delta(c.ctr, p.ctr)],
    ["CPC (링크)", fmtW(c.cpc), delta(c.cpc, p.cpc, true)],
    ["구매", fmtN(c.purchases), delta(c.purchases, p.purchases)],
    ["구매전환값", fmtW(c.purchase_value), delta(c.purchase_value, p.purchase_value)],
    ["ROAS", fmtR(c.roas), delta(c.roas, p.roas)],
  ];
  document.getElementById("kpis").innerHTML = kpis.map(([l, v, d]) =>
    `<div class="kpi"><div class="label">${l}</div><div class="val">${v}</div><div class="delta">${d}</div></div>`).join("");

  // 추이 차트
  const dates = []; for (let d = since; d <= until; d = addDays(d, 1)) dates.push(d);
  const byDate = {}; for (const r of cur) (byDate[r.date] ||= []).push(r);
  const sp = dates.map(d => sum(byDate[d] || []).spend), rv = dates.map(d => sum(byDate[d] || []).purchase_value);
  const css = getComputedStyle(document.documentElement);
  const col = v => css.getPropertyValue(v).trim();
  if (chart) chart.destroy();
  chart = new Chart(document.getElementById("trend"), {
    data: {
      labels: dates.map(d => d.slice(5)),
      datasets: [
        { type: "bar", label: "지출", data: sp, backgroundColor: col("--s1"), yAxisID: "y", borderRadius: 3 },
        { type: "line", label: "구매전환값", data: rv, borderColor: col("--s2"), backgroundColor: col("--s2"), yAxisID: "y1", tension: 0.3, pointRadius: 2 },
      ],
    },
    options: {
      maintainAspectRatio: false, interaction: { mode: "index", intersect: false },
      plugins: { legend: { labels: { color: col("--muted") } }, tooltip: { callbacks: { label: x => `${x.dataset.label}: ${fmtW(x.raw)}` } } },
      scales: {
        x: { ticks: { color: col("--muted") }, grid: { display: false } },
        y: { position: "left", ticks: { color: col("--muted"), callback: v => (v / 10000).toLocaleString() + "만" }, grid: { color: col("--line") } },
        y1: { position: "right", ticks: { color: col("--muted"), callback: v => (v / 10000).toLocaleString() + "만" }, grid: { display: false } },
      },
    },
  });

  // 계정 테이블
  const accHead = `<tr><th>계정</th><th>지출</th><th>노출</th><th>링크클릭</th><th>CTR</th><th>CPC</th><th>장바구니</th><th>구매</th><th>구매전환값</th><th>ROAS</th><th>ROAS 증감</th></tr>`;
  const accRows = DATA.accounts.filter(a => ACCOUNT === "all" || a.id === ACCOUNT).map(a => {
    const s = sum(cur.filter(r => r.account_id === a.id)), ps = sum(prev.filter(r => r.account_id === a.id));
    return `<tr><td>${a.name}${a.type === "collab" ? '<span class="badge">협력</span>' : ""}</td>
      <td>${fmtW(s.spend)}</td><td>${fmtN(s.impressions)}</td><td>${fmtN(s.link_clicks)}</td><td>${fmtP(s.ctr)}</td><td>${fmtW(s.cpc)}</td>
      <td>${fmtN(s.add_to_cart)}</td><td>${fmtN(s.purchases)}</td><td>${fmtW(s.purchase_value)}</td><td>${fmtR(s.roas)}</td><td>${delta(s.roas, ps.roas)}</td></tr>`;
  }).join("");
  const tot = `<tr class="total"><td>합계</td><td>${fmtW(c.spend)}</td><td>${fmtN(c.impressions)}</td><td>${fmtN(c.link_clicks)}</td><td>${fmtP(c.ctr)}</td><td>${fmtW(c.cpc)}</td><td>${fmtN(c.add_to_cart)}</td><td>${fmtN(c.purchases)}</td><td>${fmtW(c.purchase_value)}</td><td>${fmtR(c.roas)}</td><td>${delta(c.roas, p.roas)}</td></tr>`;
  document.getElementById("accTable").innerHTML = accHead + accRows + tot;

  // 캠페인 테이블
  const camps = {};
  for (const r of cur) (camps[r.campaign_id] ||= { name: r.campaign_name, acc: r.account_name, type: r.account_type, rows: [] }).rows.push(r);
  let list = Object.values(camps).map(x => ({ ...x, ...sum(x.rows) })).filter(x => x.spend > 0);
  list.sort((a, b) => campSort.dir * ((a[campSort.key] || 0) - (b[campSort.key] || 0)));
  const cols = [["spend", "지출", fmtW], ["impressions", "노출", fmtN], ["link_clicks", "링크클릭", fmtN], ["ctr", "CTR", fmtP], ["cpc", "CPC", fmtW],
    ["add_to_cart", "장바구니", fmtN], ["purchases", "구매", fmtN], ["cpa", "CPA", fmtW], ["purchase_value", "구매전환값", fmtW], ["roas", "ROAS", fmtR]];
  const head = `<tr><th>캠페인</th>${cols.map(([k, l]) => `<th data-k="${k}">${l}${campSort.key === k ? (campSort.dir < 0 ? " ↓" : " ↑") : ""}</th>`).join("")}</tr>`;
  const body = list.length ? list.map(x => `<tr><td>${x.name}<div class="note">${x.acc}${x.type === "collab" ? '<span class="badge">협력</span>' : ""}</div></td>${cols.map(([k, , f]) => `<td>${f(x[k])}</td>`).join("")}</tr>`).join("")
    : `<tr><td colspan="11" class="empty">선택한 기간에 지출이 없습니다</td></tr>`;
  const t = document.getElementById("campTable");
  t.innerHTML = head + body;
  t.querySelectorAll("th[data-k]").forEach(th => th.onclick = () => {
    const k = th.dataset.k; campSort = { key: k, dir: campSort.key === k ? -campSort.dir : -1 }; render();
  });
}

function downloadCsv() {
  const since = document.getElementById("since").value, until = document.getElementById("until").value;
  const rows = filterRows(since, until);
  const cols = ["date", "account_name", "account_type", "campaign_name", "adset_name", "spend", "impressions", "reach", "clicks", "link_clicks", "view_content", "add_to_cart", "purchases", "purchase_value"];
  const esc = v => `"${String(v ?? "").replace(/"/g, '""')}"`;
  const csv = "﻿" + [cols.join(","), ...rows.map(r => cols.map(c => esc(r[c])).join(","))].join("\n");
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([csv], { type: "text/csv" }));
  a.download = `homeandheal_meta_${since}_${until}.csv`;
  a.click();
}

function applyPreset() {
  const r = presetRange(document.getElementById("preset").value);
  if (r) { document.getElementById("since").value = r[0]; document.getElementById("until").value = r[1]; }
  render();
}

fetch("data/daily.json?t=" + Date.now()).then(r => r.json()).then(d => {
  DATA = d;
  document.getElementById("updated").textContent = `마지막 갱신: ${d.updated_at} · 계정 ${d.accounts.length}개`;
  const tabs = [{ id: "all", name: "전체" }, ...d.accounts];
  const box = document.getElementById("tabs");
  box.innerHTML = tabs.map(a => `<button class="tab${a.id === "all" ? " on" : ""}" data-id="${a.id}">${a.name}</button>`).join("");
  box.querySelectorAll(".tab").forEach(b => b.onclick = () => {
    ACCOUNT = b.dataset.id; box.querySelectorAll(".tab").forEach(x => x.classList.toggle("on", x === b)); render();
  });
  document.getElementById("preset").onchange = applyPreset;
  ["since", "until"].forEach(id => document.getElementById(id).onchange = () => { document.getElementById("preset").value = "custom"; render(); });
  document.getElementById("csv").onclick = downloadCsv;
  applyPreset();
}).catch(() => {
  document.getElementById("updated").textContent = "data/daily.json 을 찾을 수 없습니다. Actions 에서 수집을 먼저 실행하세요.";
});
</script>
</body>
</html>
